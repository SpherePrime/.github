<g class="rise" style="animation-delay:0.75s">
  <text x="406.0" y="376.0" font-size="10" fill="#57554f" class="mono">01</text><text x="428.0" y="376.0" font-size="13" fill="#ecebe5" class="mono">Rust (Core / Proxy / VPN)</text>
